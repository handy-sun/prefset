upstream emby-backend {
    server  127.0.0.1:8196;
    keepalive 10240;
}

server {
    # listen 80;
    # listen [::]:80;
    listen 899 ssl;
    listen [::]:899 ssl;
    server_name ei.quebit.top;
    charset     utf-8;
    index       index.html;

    ssl_certificate     /etc/nginx/quebit.top/fullchain.cer;
    ssl_certificate_key /etc/nginx/quebit.top/quebit.top.key;

    add_header Strict-Transport-Security "max-age=15552000; preload" always;
    error_page 497  https://$host$request_uri;

    location ~ \.well-known {
        allow all;
    }

    client_body_buffer_size 512k;
    client_max_body_size 20M;

    add_header 'Referrer-Policy' 'origin-when-cross-origin';
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    keepalive_timeout 120s;
    keepalive_requests 10240;

    proxy_hide_header X-Powered-By;
    proxy_buffer_size 32k;
    proxy_buffers 4 64k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 128k;
    proxy_connect_timeout 1h;
    proxy_send_timeout 1h;
    proxy_read_timeout 1h;

    location = / {
        return 302 web/index.html;
    }

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Protocol $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Accept-Encoding "";
    proxy_http_version 1.1;

    location / {
        proxy_pass http://emby-backend;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache off;
    }

    location /web/ {
        proxy_pass http://emby-backend;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # proxy_cache off;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
    }

    location = /embywebsocket {
        proxy_pass http://emby-backend;
        proxy_set_header Host $host;
        proxy_set_header Connection "upgrade";
        proxy_cache off;
    }

    location /emby/videos/ {
        proxy_pass http://emby-backend;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_buffering off;
    }

    # access_log  off;
    # error_log  off;
    access_log /var/log/nginx/ei_access.log main;
    error_log /var/log/nginx/ei_error.log;
}

