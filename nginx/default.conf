server {
    listen      80;
    listen      [::]:80;
    # listen      443 http2 ssl proxy_protocol; # parameter: http2 is deprecated
    listen      443 ssl proxy_protocol;
    listen      [::]:443 ssl proxy_protocol;

    root        /var/www/html;
    charset     utf-8;
    server_name www.quebit.top;
    index       index.html index.php;

    ssl_certificate     /etc/nginx/quebit.top/fullchain.cer;
    ssl_certificate_key /etc/nginx/quebit.top/quebit.top.key;

    real_ip_header proxy_protocol;
    error_page 497 https://$http_host$request_uri; # http error code:497 transmit to https request

    # empty UA is forbidden
    if ($http_user_agent ~ ^$){
        return 403;
    }
    # deny some crawler websites, allow curl
    if ($http_user_agent ~* "Scrapy|python|Nmap|wget|httpclient|MJ12bot|Expanse|ahrefsbot|seznambot|serpstatbot|sindresorhus|zgrab"){
        return 403;
    }
    # if ($request_uri ~* "^/announce*") {
        # return 710;
    # }

    location / {
        set $real_ip $proxy_protocol_addr;
        access_log /var/log/nginx/access$2.log main;
    }

    location /dav {
        root /var/www;
        charset utf-8;
        dav_methods PUT DELETE MKCOL COPY MOVE;
        dav_ext_methods PROPFIND OPTIONS;
        dav_access user:rw group:rw all:rw;
        client_max_body_size 20M;
        create_full_put_path on;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_after_body /autoindex.html;
        # First attempt to serve request as file, then as directory, then fall back to displaying a 404.
        try_files $uri $uri/ =404;
        # if ($uri !~* /$) {
            # add_header Content-Disposition attachment;
        # }
        access_log /var/log/nginx/dav$2.log main;
    }

    location /ntfs {
        root /mnt;
        dav_methods PUT DELETE MKCOL COPY MOVE;
        dav_ext_methods PROPFIND OPTIONS;
        dav_access user:rw group:r all:r;
        client_max_body_size 0;
        create_full_put_path on;
        autoindex on;
        # authorized user can login
        auth_basic "Access limited";
        auth_basic_user_file /etc/nginx/.passwords.list;
        access_log /var/log/nginx/ntfs.log main;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_after_body /autoindex.html;
        try_files $uri $uri/ =404;
    }

    location ^~ /.* {
        deny all;
    }

    location /als/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:5244;
        client_max_body_size 10240m;
        access_log /var/log/nginx/alist_access$2.log main;
    }

    location /qbt/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:8028/;
        access_log /var/log/nginx/qbt_access$2.log main;
    }

    location /ar2/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:6880/;
        access_log /var/log/nginx/ar2$2.log main;
    }
    location = /ar2/jsonrpc {
        rewrite /ar2/(.*) /$1  break;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:6800;
        proxy_http_version 1.1;
        access_log /var/log/nginx/rpc$2.log main;
    }

    location ~ \.php$ {
        try_files $uri = 404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$; 
        # fastcgi_pass 127.0.0.1:9000;
        fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params; 
    }
    error_page  404              /404.html;
    error_page  500 502 503 504  /50x.html;
}

